{% extends "base.html" %}{% block content %}<h1>Notificaciones</h1>{% for n in notifications %}<article class="card"><h2>{{ n.titulo }} {{ '· Leída' if n.leida }}</h2><p>{{ n.mensaje }}</p><a href="{{ n.accion.ruta }}">Ver detalles</a>{% if not n.leida %}<form method="post" action="/notificaciones/{{ n.id }}/leer"><input type="hidden" name="csrf_token" value="{{ g.csrf_token }}"><button class="secondary">Marcar como leída</button></form>{% endif %}</article>{% else %}<section class="card"><img class="jami-art" src="/static/img/jami-ideas.png" alt=""><p>Todo en orden por ahora.</p><a href="/">Ir a Inicio</a></section>{% endfor %}{% endblock %}
