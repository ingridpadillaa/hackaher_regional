name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cochinito/requirements.txt
      - run: pip install -r cochinito/requirements.txt ruff
      - run: python -m pytest -q
        working-directory: cochinito
      - run: ruff check --config pyproject.toml --select E4,E7,E9,F,I app scripts tests
        working-directory: cochinito
